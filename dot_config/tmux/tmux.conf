# https://tmux.app/doc/ghostty/
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s extended-keys on

# https://man.openbsd.org/OpenBSD-current/man1/tmux.1

set-option -g prefix C-a

bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "Sourced config file: $XDG_CONFIG_HOME/tmux/tmux.conf."

set-option -g base-index 1
set-option -g renumber-windows

set -ag status-style "bg=#343F44 fg=#D3C6AA"

# Key bindings
bind K confirm-before -p "kill window #W? (y/n)" kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind v split-window -h
bind V split-window -v

