# tmux runs a server that will only exit once all sessions are closed.
# tmux options and keybinds are persistent per-server, across client detaches.
# tmux.reset.conf resets options and keybinds to default, to allow for clean sourcing of tmux.conf.
source-file $XDG_CONFIG_HOME/tmux/tmux.reset.conf

bind R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "Sourced config file: $XDG_CONFIG_HOME/tmux/tmux.conf."

# https://tmux.app/doc/ghostty/
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s extended-keys on

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # hit prefix twice for remote tmux sessions

set -g base-index 1
set -g renumber-windows
set -g mode-keys vi

set -ag status-style "bg=#343F44 fg=#D3C6AA"

# key bindings
# copy mode
bind Escape copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection 
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# windows
bind r command-prompt -I'#W' "rename-window -- '%%'"
bind K confirm-before -p "kill window #W? (y/n)" kill-window
bind v split-window -h
bind V split-window -v

# panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# plugins
set -g @plugin 'tmux-plugins/tpm'

run $XDG_CONFIG_HOME/tmux/plugins/tpm/tpm
