# tmux runs a server that will only exit once all sessions are closed.
# tmux options and keybinds are persistent per-server, across client detaches.
# tmux.reset.conf resets options and keybinds to default, to allow for clean sourcing of tmux.conf.
source-file $XDG_CONFIG_HOME/tmux/tmux.reset.conf

bind R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "Sourced config file: $XDG_CONFIG_HOME/tmux/tmux.conf."

# https://tmux.app/doc/ghostty/
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s extended-keys on

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # hit prefix twice for remote tmux sessions

set -g base-index 1
set -g renumber-windows
set -g detach-on-destroy off
set -g escape-time 0
set -s set-clipboard on
set -g mode-keys vi
set -g mouse on

bind -n ^F run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

set -ag status-style "bg=#343F44 fg=#D3C6AA"

# key bindings
# copy mode
bind Escape copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection 
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# windows
bind a last-window
bind r command-prompt -I'#W' "rename-window -- '%%'"
bind K confirm-before -p "kill window #W? (y/n)" kill-window
bind v split-window -h
bind V split-window -v

# panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# plugins
set -g @plugin 'tmux-plugins/tpm'

run $XDG_CONFIG_HOME/tmux/plugins/tpm/tpm
